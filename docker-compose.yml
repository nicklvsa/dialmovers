version: '3.8'

services:
  webhook-server:
    build:
      context: ./packages/webhook-server
      dockerfile: ../../docker/webhook-server/Dockerfile
    container_name: dialmovers-webhook-server
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - WEBHOOK_SERVER_PORT=8080
      - WEBHOOK_SERVER_HOST=0.0.0.0
      - GAME_SERVER_URL=ws://game-server:8081
      - GAME_SPEED=${GAME_SPEED:-20}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-15m}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
    volumes:
      - ./packages/webhook-server/src:/app/src:ro
      - ./packages/webhook-server/tests:/app/tests:ro
    depends_on:
      game-server:
        condition: service_healthy
    networks:
      - dialmovers-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  game-server:
    build:
      context: ./packages/game-server
      dockerfile: ../../docker/game-server/Dockerfile
    container_name: dialmovers-game-server
    ports:
      - "8081:8081"
    environment:
      - GAME_SERVER_PORT=8081
      - GAME_SERVER_HOST=0.0.0.0
      - WS_PING_INTERVAL=${WS_PING_INTERVAL:-27s}
      - WS_WRITE_TIMEOUT=${WS_WRITE_TIMEOUT:-10s}
      - WS_MESSAGE_LIMIT=${WS_MESSAGE_LIMIT:-1024}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - GAME_SPEED=${GAME_SPEED:-20}
      - CANVAS_WIDTH=${CANVAS_WIDTH:-800}
      - CANVAS_HEIGHT=${CANVAS_HEIGHT:-600}
      - STARTING_X=${STARTING_X:-100}
      - STARTING_Y=${STARTING_Y:-100}
    volumes:
      - ./packages/game-server:/app:ro
    networks:
      - dialmovers-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  web-client:
    build:
      context: ./packages/web-client
      dockerfile: ../../docker/web-client/Dockerfile
    container_name: dialmovers-web-client
    ports:
      - "80:80"
    environment:
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8081}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./packages/web-client/public:/usr/share/nginx/html/public:ro
    depends_on:
      - webhook-server
      - game-server
    networks:
      - dialmovers-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  dialmovers-network:
    driver: bridge
